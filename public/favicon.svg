<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="jarBg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#F5E6D0"/>
    </radialGradient>
    <radialGradient id="bubbleGrad" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FDECC8"/>
      <stop offset="100%" stop-color="#E8C99A"/>
    </radialGradient>
    <!-- Background circle -->
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" ry="14" fill="#6B3A1F"/>

  <!-- Inner warm bg -->
  <rect x="4" y="4" width="56" height="56" rx="11" ry="11" fill="#8B4F2B"/>

  <!-- Jar body -->
  <rect x="16" y="26" width="32" height="26" rx="4" ry="4" fill="url(#jarBg)" stroke="#C47A3A" stroke-width="1.5"/>

  <!-- Jar neck -->
  <rect x="20" y="20" width="24" height="8" rx="2" fill="url(#jarBg)" stroke="#C47A3A" stroke-width="1.5"/>

  <!-- Jar lid -->
  <rect x="17" y="15" width="30" height="7" rx="3" fill="#C47A3A"/>
  <rect x="21" y="17" width="22" height="3" rx="1.5" fill="#E8935A" opacity="0.6"/>

  <!-- Sourdough bubbles (active starter!) -->
  <circle cx="26" cy="36" r="4" fill="url(#bubbleGrad)" stroke="#C47A3A" stroke-width="0.8"/>
  <circle cx="38" cy="33" r="5" fill="url(#bubbleGrad)" stroke="#C47A3A" stroke-width="0.8"/>
  <circle cx="30" cy="42" r="3.5" fill="url(#bubbleGrad)" stroke="#C47A3A" stroke-width="0.8"/>
  <circle cx="40" cy="43" r="3" fill="url(#bubbleGrad)" stroke="#C47A3A" stroke-width="0.8"/>

  <!-- Tiny highlight bubbles -->
  <circle cx="25" cy="35" r="1" fill="white" opacity="0.7"/>
  <circle cx="37" cy="32" r="1.2" fill="white" opacity="0.7"/>

  <!-- Rise lines (dough rising) -->
  <path d="M22 30 Q32 25 42 30" stroke="#C47A3A" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Small wheat on lid -->
  <circle cx="32" cy="18.5" r="1.5" fill="#FFF0E0" opacity="0.8"/>
</svg>
