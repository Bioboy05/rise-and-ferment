# ============================================================
# netlify.toml — Rise & Ferment
# Optimizat pentru Netlify Pro ($20/mo)
# ============================================================

[build]
  command = "npm run build"
  publish = "dist"
  node_bundler = "esbuild"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--prefer-offline"

# ============================================================
# EDGE NETWORK — Cache headers pentru assets statice
# Vite genereaza fisiere cu hash in nume → cache forever
# ============================================================

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML — no-cache (se schimba la fiecare deploy)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers — toate paginile
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

