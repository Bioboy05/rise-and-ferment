# ============================================================
# netlify.toml — Rise & Ferment
# Optimizat pentru Netlify Pro ($20/mo)
# ============================================================

[build]
  command = "npm run build"
  publish = "dist"
  node_bundler = "esbuild"
  # Skip build when only content/docs/non-app files changed
  # Returns exit code 0 = skip build, 1 = proceed with build
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src/ public/ index.html package.json netlify.toml vite.config.js"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--prefer-offline"

# ============================================================
# EDGE NETWORK — Cache headers pentru assets statice
# Vite genereaza fisiere cu hash in nume → cache forever
# ============================================================

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML — no-cache (se schimba la fiecare deploy)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# PDF — cache 1 day
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Security headers — toate paginile
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://assets.mailerlite.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.netlify.app https://api.mailerlite.com https://assets.mailerlite.com https://*.nsvcs.net; frame-ancestors 'none'"

