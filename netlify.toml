# ============================================================
# NETLIFY FORMS — Form submissions
# ============================================================

# Formele sunt detectate automat din HTML (data-netlify="true")
# Nu necesita configuratie suplimentara in toml

# ============================================================
# DEPLOY CONTEXTS — Preview + Production
# ============================================================

[context.production]
  command = "npm run build"

[context.deploy-preview]
